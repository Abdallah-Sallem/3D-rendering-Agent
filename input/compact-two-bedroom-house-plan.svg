<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
    <defs>
        <style>
            .bg { fill: #fcfcfc; }
            .wall-ext { stroke: #1a1a1a; stroke-width: 8; stroke-linecap: square; fill: none; }
            .wall-int { stroke: #2a2a2a; stroke-width: 5; stroke-linecap: square; fill: none; }
            .mask { fill: #fcfcfc; }
            .window { fill: #e0f7fa; stroke: #1a1a1a; stroke-width: 2; }
            .door-leaf { stroke: #e53935; stroke-width: 3; stroke-linecap: round; fill: none; }
            .door-swing { fill: none; stroke: #e53935; stroke-width: 1.5; stroke-dasharray: 4 4; }
            .furniture { fill: #ffffff; stroke: #888888; stroke-width: 1.5; }
            .fixture { fill: #ffffff; stroke: #555555; stroke-width: 1.5; }
            .tile-bg { fill: url(#tile); }
            .wood-bg { fill: url(#wood); }
            .text-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #222222; text-anchor: middle; letter-spacing: 1px; }
            .text-area { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; fill: #666666; text-anchor: middle; }
            .landscape { fill: none; stroke: #aed581; stroke-width: 2; }
            .deck { fill: #d7ccc8; stroke: #8d6e63; stroke-width: 2; }
        </style>
        <pattern id="tile" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect width="20" height="20" fill="none" stroke="#e0e0e0" stroke-width="0.8"/>
        </pattern>
        <pattern id="wood" width="10" height="100" patternUnits="userSpaceOnUse">
            <line x1="10" y1="0" x2="10" y2="100" stroke="#f0e5de" stroke-width="1"/>
        </pattern>
    </defs>

    <!-- Canvas Background -->
    <rect width="1200" height="900" fill="#ffffff" />
    
    <!-- Exterior Landscaping / Patio Elements -->
    <rect x="180" y="130" width="840" height="640" fill="#fcfcfc" rx="10" ry="10" class="landscape" stroke-dasharray="10 10"/>
    <rect x="700" y="750" width="220" height="80" class="deck" rx="4" ry="4" />
    <path d="M720,750 L720,830 M740,750 L740,830 M760,750 L760,830 M780,750 L780,830 M800,750 L800,830 M820,750 L820,830 M840,750 L840,830 M860,750 L860,830 M880,750 L880,830 M900,750 L900,830" stroke="#a1887f" stroke-width="1"/>

    <!-- Floor Finishes (Tiles and Wood) -->
    <rect x="200" y="150" width="250" height="250" class="wood-bg" /> <!-- Master Bed -->
    <rect x="200" y="550" width="250" height="200" class="wood-bg" /> <!-- Bed 2 -->
    <rect x="300" y="400" width="150" height="150" class="tile-bg" /> <!-- Bathroom -->
    <rect x="450" y="150" width="150" height="100" class="tile-bg" /> <!-- Laundry -->
    <rect x="450" y="250" width="150" height="100" class="tile-bg" /> <!-- Guest WC -->
    <rect x="450" y="600" width="150" height="150" class="tile-bg" /> <!-- Entrance -->
    <rect x="600" y="150" width="200" height="250" class="tile-bg" /> <!-- Kitchen -->

    <!-- ==================== WALLS ==================== -->
    
    <!-- Exterior Walls -->
    <rect x="200" y="150" width="800" height="600" class="wall-ext" />

    <!-- Interior Vertical Walls -->
    <line x1="300" y1="400" x2="300" y2="550" class="wall-int" />
    <line x1="450" y1="150" x2="450" y2="750" class="wall-int" />
    <line x1="600" y1="150" x2="600" y2="750" class="wall-int" />

    <!-- Interior Horizontal Walls -->
    <line x1="450" y1="250" x2="600" y2="250" class="wall-int" /> <!-- Laundry / WC -->
    <line x1="450" y1="350" x2="600" y2="350" class="wall-int" /> <!-- WC / Hallway -->
    <line x1="200" y1="400" x2="450" y2="400" class="wall-int" /> <!-- Master / Bath & Storage -->
    <line x1="200" y1="550" x2="450" y2="550" class="wall-int" /> <!-- Bath & Storage / Bed 2 -->
    <line x1="450" y1="600" x2="600" y2="600" class="wall-int" /> <!-- Hallway / Entrance -->

    <!-- ==================== WALL MASKS FOR DOORS/ARCHES ==================== -->
    
    <!-- Exterior Entrance Mask -->
    <rect x="500" y="746" width="60" height="8" class="mask" />
    <!-- Ent -> Hall Mask -->
    <rect x="500" y="596" width="50" height="8" class="mask" />
    <!-- Ent -> Living Mask -->
    <rect x="596" y="650" width="8" height="50" class="mask" />
    <!-- Hall -> Living Archway -->
    <rect x="596" y="450" width="8" height="100" class="mask" />
    <!-- Hall -> Kitchen Archway -->
    <rect x="596" y="350" width="8" height="50" class="mask" />
    <!-- WC Door Mask -->
    <rect x="480" y="346" width="40" height="8" class="mask" />
    <!-- Laundry Door Mask -->
    <rect x="596" y="180" width="8" height="40" class="mask" />
    <!-- Master Bed Door Mask -->
    <rect x="446" y="360" width="8" height="40" class="mask" />
    <!-- Bath Door Mask -->
    <rect x="446" y="450" width="8" height="40" class="mask" />
    <!-- Bed 2 Door Mask -->
    <rect x="446" y="560" width="8" height="40" class="mask" />
    <!-- Storage Door Mask -->
    <rect x="240" y="396" width="40" height="8" class="mask" />

    <!-- ==================== DOORS ==================== -->
    
    <!-- Main Entrance Door (Opens In) -->
    <line x1="500" y1="750" x2="500" y2="690" class="door-leaf" />
    <path d="M500,690 A60,60 0 0,1 560,750" class="door-swing" />
    
    <!-- Ent -> Hall Door -->
    <line x1="500" y1="600" x2="500" y2="550" class="door-leaf" />
    <path d="M500,550 A50,50 0 0,1 550,600" class="door-swing" />
    
    <!-- Ent -> Liv Door -->
    <line x1="600" y1="700" x2="650" y2="700" class="door-leaf" />
    <path d="M650,700 A50,50 0 0,0 600,650" class="door-swing" />

    <!-- WC Door -->
    <line x1="520" y1="350" x2="520" y2="310" class="door-leaf" />
    <path d="M520,310 A40,40 0 0,0 480,350" class="door-swing" />

    <!-- Laundry Door -->
    <line x1="600" y1="180" x2="560" y2="180" class="door-leaf" />
    <path d="M560,180 A40,40 0 0,0 600,220" class="door-swing" />

    <!-- Master Bed Door -->
    <line x1="450" y1="360" x2="410" y2="360" class="door-leaf" />
    <path d="M410,360 A40,40 0 0,0 450,400" class="door-swing" />

    <!-- Bath Door -->
    <line x1="450" y1="450" x2="410" y2="450" class="door-leaf" />
    <path d="M410,450 A40,40 0 0,0 450,490" class="door-swing" />

    <!-- Bed 2 Door -->
    <line x1="450" y1="600" x2="410" y2="600" class="door-leaf" />
    <path d="M410,600 A40,40 0 0,1 450,560" class="door-swing" />

    <!-- Storage Door -->
    <line x1="240" y1="400" x2="240" y2="440" class="door-leaf" />
    <path d="M240,440 A40,40 0 0,0 280,400" class="door-swing" />

    <!-- ==================== WINDOWS ==================== -->
    
    <!-- Master Bed Windows -->
    <rect x="196" y="225" width="8" height="100" class="window" />
    <rect x="250" y="146" width="80" height="8" class="window" />
    
    <!-- Bathroom Window -->
    <rect x="196" y="450" width="8" height="60" class="window" />
    
    <!-- Bed 2 Windows -->
    <rect x="196" y="600" width="8" height="100" class="window" />
    <rect x="250" y="746" width="100" height="8" class="window" />
    
    <!-- Laundry Window -->
    <rect x="500" y="146" width="60" height="8" class="window" />
    
    <!-- Kitchen Window -->
    <rect x="650" y="146" width="100" height="8" class="window" />
    
    <!-- Dining Windows -->
    <rect x="850" y="146" width="100" height="8" class="window" />
    <rect x="996" y="200" width="8" height="150" class="window" />
    
    <!-- Living Room Windows / Patio Doors -->
    <rect x="996" y="450" width="8" height="200" class="window" />
    <rect x="700" y="746" width="220" height="8" class="window" fill="#b2ebf2" /> <!-- Large Sliding Doors -->
    <!-- Entrance Sidelight -->
    <rect x="420" y="746" width="40" height="8" class="window" />

    <!-- ==================== FURNITURE & FIXTURES ==================== -->

    <!-- Master Bed -->
    <rect x="220" y="180" width="110" height="120" rx="5" ry="5" class="furniture" />
    <rect x="230" y="190" width="40" height="25" rx="3" ry="3" class="furniture" />
    <rect x="280" y="190" width="40" height="25" rx="3" ry="3" class="furniture" />
    <line x1="220" y1="230" x2="330" y2="230" stroke="#888888" stroke-width="1.5" />

    <!-- Bed 2 -->
    <rect x="220" y="580" width="80" height="110" rx="5" ry="5" class="furniture" />
    <rect x="240" y="590" width="40" height="25" rx="3" ry="3" class="furniture" />
    <line x1="220" y1="625" x2="300" y2="625" stroke="#888888" stroke-width="1.5" />

    <!-- Bathroom Fixtures -->
    <!-- Tub -->
    <rect x="305" y="405" width="140" height="50" rx="10" ry="10" class="fixture" />
    <circle cx="330" cy="430" r="5" fill="#555" />
    <!-- Toilet -->
    <rect x="320" y="525" width="25" height="20" rx="3" ry="3" class="fixture" />
    <ellipse cx="332.5" cy="510" rx="10" ry="14" class="fixture" />
    <!-- Sink Counter -->
    <rect x="400" y="490" width="45" height="55" class="fixture" />
    <ellipse cx="422.5" cy="517.5" rx="15" ry="12" class="fixture" />

    <!-- Guest WC Fixtures -->
    <rect x="570" y="255" width="25" height="20" rx="3" ry="3" class="fixture" />
    <ellipse cx="582.5" cy="285" rx="10" ry="12" class="fixture" />
    <rect x="460" y="255" width="35" height="25" class="fixture" />
    <ellipse cx="477.5" cy="267.5" rx="10" ry="8" class="fixture" />

    <!-- Laundry Fixtures -->
    <rect x="460" y="160" width="40" height="40" class="fixture" />
    <circle cx="480" cy="180" r="12" fill="none" stroke="#555" stroke-width="1.5" />
    <rect x="510" y="160" width="40" height="40" class="fixture" />
    <circle cx="530" cy="180" r="12" fill="none" stroke="#555" stroke-width="1.5" />
    <rect x="560" y="160" width="35" height="40" class="fixture" /> <!-- Wash Basin -->

    <!-- Storage Shelves -->
    <line x1="205" y1="410" x2="205" y2="540" stroke="#888" stroke-width="4" stroke-dasharray="20 5" />
    <line x1="285" y1="450" x2="285" y2="540" stroke="#888" stroke-width="4" stroke-dasharray="20 5" />
    <line x1="210" y1="540" x2="280" y2="540" stroke="#888" stroke-width="4" stroke-dasharray="20 5" />

    <!-- Kitchen Setup -->
    <!-- Island -->
    <rect x="680" y="320" width="100" height="40" rx="3" ry="3" class="furniture" />
    <circle cx="700" cy="340" r="8" fill="none" stroke="#666" stroke-width="1" />
    <circle cx="720" cy="340" r="8" fill="none" stroke="#666" stroke-width="1" />
    <circle cx="740" cy="340" r="8" fill="none" stroke="#666" stroke-width="1" />
    <circle cx="760" cy="340" r="8" fill="none" stroke="#666" stroke-width="1" />
    <!-- Counters -->
    <rect x="605" y="155" width="170" height="45" class="furniture" />
    <rect x="730" y="200" width="45" height="90" class="furniture" />
    <!-- Sink & Stove -->
    <rect x="640" y="160" width="50" height="35" rx="4" ry="4" class="fixture" />
    <circle cx="655" cy="177" r="10" fill="none" stroke="#555" />
    <circle cx="675" cy="177" r="10" fill="none" stroke="#555" />
    <rect x="735" y="220" width="35" height="50" class="fixture" />
    <circle cx="745" cy="235" r="5" class="fixture" /><circle cx="760" cy="235" r="5" class="fixture" />
    <circle cx="745" cy="255" r="5" class="fixture" /><circle cx="760" cy="255" r="5" class="fixture" />

    <!-- Dining Setup -->
    <rect x="840" y="220" width="100" height="130" rx="10" ry="10" class="furniture" />
    <!-- Chairs -->
    <rect x="825" y="240" width="15" height="25" rx="4" ry="4" class="furniture" />
    <rect x="825" y="280" width="15" height="25" rx="4" ry="4" class="furniture" />
    <rect x="940" y="240" width="15" height="25" rx="4" ry="4" class="furniture" />
    <rect x="940" y="280" width="15" height="25" rx="4" ry="4" class="furniture" />
    <rect x="860" y="205" width="25" height="15" rx="4" ry="4" class="furniture" />
    <rect x="900" y="205" width="25" height="15" rx="4" ry="4" class="furniture" />
    <rect x="860" y="350" width="25" height="15" rx="4" ry="4" class="furniture" />
    <rect x="900" y="350" width="25" height="15" rx="4" ry="4" class="furniture" />

    <!-- Living Room Setup -->
    <!-- Rug -->
    <rect x="700" y="450" width="250" height="200" fill="#f4f4f4" stroke="#cccccc" stroke-dasharray="4 4" rx="5" ry="5"/>
    <!-- L-Shaped Sofa -->
    <rect x="720" y="470" width="180" height="45" rx="6" ry="6" class="furniture" />
    <rect x="855" y="515" width="45" height="100" rx="6" ry="6" class="furniture" />
    <!-- Coffee Table -->
    <rect x="760" y="540" width="70" height="50" rx="5" ry="5" class="furniture" fill="#eeeeee"/>
    <!-- TV Unit -->
    <rect x="700" y="680" width="180" height="25" class="furniture" />
    <rect x="740" y="690" width="100" height="10" fill="#333" />
    <!-- Plant -->
    <circle cx="650" cy="450" r="15" fill="#e8f5e9" stroke="#81c784" stroke-width="2"/>
    <circle cx="950" cy="680" r="15" fill="#e8f5e9" stroke="#81c784" stroke-width="2"/>

    <!-- ==================== ROOM LABELS ==================== -->
    
    <text x="325" y="310" class="text-title">Master Bedroom</text>
    <text x="325" y="330" class="text-area">25 m²</text>

    <text x="325" y="660" class="text-title">Second Bedroom</text>
    <text x="325" y="680" class="text-area">20 m²</text>

    <text x="375" y="475" class="text-title">Bathroom</text>
    
    <text x="250" y="475" class="text-title">Storage</text>

    <text x="525" y="200" class="text-title">Laundry</text>

    <text x="525" y="300" class="text-title">Guest WC</text>

    <text x="525" y="475" class="text-title">Hallway</text>

    <text x="525" y="675" class="text-title">Entrance</text>

    <text x="680" y="275" class="text-title">Kitchen</text>
    
    <text x="890" y="275" class="text-title">Dining Room</text>

    <text x="825" y="575" class="text-title">Living Room</text>
    <text x="825" y="595" class="text-area">45 m²</text>

    <!-- Compass / Scale -->
    <circle cx="110" cy="800" r="25" fill="none" stroke="#222" stroke-width="2"/>
    <path d="M110,770 L115,800 L110,795 L105,800 Z" fill="#222"/>
    <text x="110" y="760" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">N</text>
    <line x1="80" y1="840" x2="180" y2="840" stroke="#222" stroke-width="2"/>
    <line x1="80" y1="835" x2="80" y2="845" stroke="#222" stroke-width="2"/>
    <line x1="130" y1="835" x2="130" y2="845" stroke="#222" stroke-width="2"/>
    <line x1="180" y1="835" x2="180" y2="845" stroke="#222" stroke-width="2"/>
    <text x="80" y="860" font-family="sans-serif" font-size="10" fill="#222" text-anchor="middle">0</text>
    <text x="130" y="860" font-family="sans-serif" font-size="10" fill="#222" text-anchor="middle">1m</text>
    <text x="180" y="860" font-family="sans-serif" font-size="10" fill="#222" text-anchor="middle">2m</text>

</svg>
